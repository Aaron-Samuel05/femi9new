<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>femi9 — V3 Prototype</title>
<link rel="icon" type="image/png" href="logo.png"/>
<style>
  :root{
    --bg:#EFEAF3; --panel:#ffffff; --ink:#2A2340; --muted:#8A82A0; --purple:#4A2E7A;
    --yellow:#E8B93C; --line:#e7e1ef; --shadow:0 30px 60px -20px rgba(42,35,64,.35);
    --pw:300px; /* phone display width */
    --ph:650px; /* phone viewport height */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 78% -10%,#F6F0E8 0%,transparent 55%),var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased;
    display:grid; grid-template-columns:288px 1fr; min-height:100%;
  }
  /* ---------- sidebar ---------- */
  aside{
    background:var(--panel); border-right:1px solid var(--line);
    padding:22px 18px 40px; overflow-y:auto; position:sticky; top:0; height:100vh;
  }
  .brandimg{display:block;height:34px;width:auto;margin:2px 4px 6px}
  .tag{display:inline-block;font-size:11px;font-weight:600;color:#1E4A38;
    background:#E7F0EA;border-radius:999px;padding:3px 9px;margin:2px 4px 14px}
  .sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:16px 6px 6px}
  .item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;
    font-size:13.5px;color:var(--ink);cursor:pointer;line-height:1.2}
  .item:hover{background:#F4F0FA}
  .item.active{background:var(--purple);color:#fff}
  .item .code{font-size:10.5px;font-weight:700;color:var(--muted);min-width:26px}
  .item.active .code{color:#D9C9F2}
  /* ---------- stage ---------- */
  main{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:30px 24px 60px;gap:18px}
  .topbar{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title h1{font-size:17px;margin:0;font-weight:700}
  .title p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
    padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
  .btn:hover{border-color:#cfc6e0}
  .btn.on{background:var(--purple);color:#fff;border-color:var(--purple)}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
  .screenname{font-size:13px;color:var(--muted);font-weight:600}
  .screenname b{color:var(--ink)}
  /* ---------- phone ---------- */
  .phone{
    position:relative;width:calc(var(--pw) + 20px);background:#15111f;border-radius:46px;
    padding:10px;box-shadow:var(--shadow);
  }
  .phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:26px;background:#15111f;border-radius:0 0 16px 16px;z-index:5}
  .screenwrap{position:relative;width:var(--pw);height:var(--ph);border-radius:38px;overflow-y:auto;overflow-x:hidden;background:#F6F1E7;scrollbar-width:none}
  .screenwrap::-webkit-scrollbar{width:0;height:0}
  .inner{position:relative;width:100%}
  .inner img{display:block;width:100%;height:auto}
  @keyframes screenIn{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
  .inner.anim{animation:screenIn .3s cubic-bezier(.22,.61,.36,1)}
  @keyframes tapPulse{0%{transform:scale(1)}34%{transform:scale(.985)}100%{transform:scale(1)}}
  .phone.tapped{animation:tapPulse .2s ease}
  .hot{-webkit-tap-highlight-color:transparent}
  .hot{position:absolute;cursor:pointer;border-radius:10px;transition:background .12s,box-shadow .12s}
  .hot:hover{background:rgba(74,46,122,.14);box-shadow:inset 0 0 0 2px rgba(74,46,122,.36)}
  body.hints .hot{background:rgba(74,46,122,.26);box-shadow:inset 0 0 0 2px rgba(74,46,122,.55)}
  body.hints .hot.tab{background:rgba(232,185,60,.30);box-shadow:inset 0 0 0 2px rgba(232,185,60,.7)}
  body.hints .hot.adv{background:rgba(74,46,122,.06);box-shadow:inset 0 0 0 2px rgba(74,46,122,.20)}
  .hot:active{background:rgba(74,46,122,.22)}
  .navrow{display:flex;align-items:center;gap:16px}
  .rnd{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--ink)}
  .rnd:hover{border-color:#cfc6e0}
  .count{font-size:12.5px;color:var(--muted);min-width:74px;text-align:center}
  .hintline{font-size:12px;color:var(--muted);max-width:var(--pw);text-align:center;line-height:1.5}
  @media (max-width:820px){
    body{grid-template-columns:1fr}
    aside{position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
  <aside>
    <img class="brandimg" src="logo.png" alt="Femi9"/>
    <span class="tag">V3 · Interactive Prototype</span>
    <div id="menu"></div>
  </aside>
  <main>
    <div class="topbar">
      <div class="title">
        <h1>femi9 — period care that cares</h1>
        <p>Interactive V3 prototype · tap the screen to move through the app</p>
      </div>
      <div class="controls">
        <button class="btn" id="hintsBtn">◉ Show tap areas</button>
        <button class="btn" id="resetBtn">↺ Restart</button>
      </div>
    </div>
    <div class="stage">
      <div class="screenname" id="sname"></div>
      <div class="phone">
        <div class="screenwrap" id="wrap">
          <div class="inner" id="inner">
            <img id="shot" alt="screen"/>
            <!-- hotspots injected here -->
          </div>
        </div>
      </div>
      <div class="navrow">
        <div class="rnd" id="prev" title="Previous screen">‹</div>
        <div class="count" id="count"></div>
        <div class="rnd" id="next" title="Next screen">›</div>
      </div>
      <div class="hintline">Tap the <b>tab bar</b>, <b>buttons</b>, or <b>back</b> arrow on the phone to navigate. Use the list on the left to jump to any of the 45 screens.</div>
    </div>
  </main>

<script>
/* ---- screen roster: [code, name, section] ---- */
const SCREENS = [
  ["SP","Splash","Start"],
  ["O1","Welcome","Onboarding"],["O2","Cycle Setup","Onboarding"],["O3","About You","Onboarding"],
  ["O4","Pad Match","Onboarding"],["O5","All Set","Onboarding"],
  ["A1","Sign In","Auth"],["A2","Reset Password","Auth"],["X5","Verify Code","Auth"],
  ["T1","Today Home","Today"],["T2","Calendar","Today"],["T3","Day Detail","Today"],["T4","Log Flow","Today"],
  ["T5","Cycle Detail","Today"],["T6","Insight Detail","Today"],["N1","Notifications","Today"],
  ["L1","Programs Hub","Learn"],["L2","Program Detail","Learn"],["L3","Lesson","Learn"],["L4","Search","Learn"],
  ["Y1","Move Hub","Move"],["Y2","Yoga Session","Move"],["Y3","Cramp Relief","Move"],
  ["C1","Circle Feed","Circle"],["C2","Post Detail","Circle"],["C3","Compose","Circle"],
  ["S1","Shop Home","Shop"],["S2","Product Detail","Shop"],["S3","Checkout","Shop"],["S4","Subscription","Shop"],
  ["S5","Order Confirmed","Shop"],["X6","Empty Cart","Shop"],["X7","Payment Failed","Shop"],
  ["M1","Profile","Account"],["M2","Orders","Account"],["M3","Settings","Account"],
  ["LO","Log Out","Account"],["X8","Delete Account","Account"],
  ["E1","Server Error","States"],["E2","No Internet","States"],["E3","Empty State","States"],
  ["X1","Not Found","States"],["X2","Maintenance","States"],["X3","Update Required","States"],["X4","Loading","States"],
];
const NAME = Object.fromEntries(SCREENS.map(s=>[s[0],s[1]]));
const ORDER = SCREENS.map(s=>s[0]);

/* ---- navigation config ---- */
const tabbed = new Set(["T1","L1","C1","S1","M1"]); // hubs with the bottom 5-tab bar
const backed = {  // top-left back arrow -> target
  O2:"O1",O3:"O2",O4:"O3",A1:"O1",A2:"A1",X5:"A1",
  T2:"T1",T3:"T2",T4:"T1",T5:"T1",T6:"T1",N1:"T1",
  L2:"L1",L3:"L2",L4:"L1",Y1:"L1",Y2:"Y1",Y3:"Y1",
  C2:"C1",C3:"C1",S2:"S1",S3:"S2",S4:"S1",M2:"M1",M3:"M1",
  X6:"S1",X7:"S3",X8:"M3"
};
// per-screen hotspots on the REAL buttons/cards: [x%, y%, w%, h%, target]. No tap-anywhere.
const HS = {
  SP:[[0,0,100,100,"O1"]],
  O1:[[6,85,88,7,"O2"],[26,93,48,4,"A1"]],
  O2:[[6,88,88,7,"O3"]],
  O3:[[6,88,88,7,"O4"]],
  O4:[[6,84,88,7,"O5"],[30,93,40,4,"O5"]],
  O5:[[6,88,88,7,"T1"]],
  A1:[[54,56,42,4,"A2"],[6,61,88,8,"T1"],[6,76,88,7,"T1"],[6,84,88,7,"T1"],[45,93,30,4,"O2"]],
  A2:[[6,85,88,7,"A1"]],
  X5:[[6,85,88,7,"O5"]],
  T1:[[82,5.5,14,5,"M1"],[5,12,90,16,"T2"],[5,28,90,19,"T5"],[5,48,90,8,"T4"],[5,57,90,8,"S4"],[5,72,90,18,"T6"]],
  T2:[[8,28,84,46,"T3"]],
  T3:[[6,86,88,8,"T4"]],
  T4:[[6,88,88,8,"T1"]],
  T5:[],T6:[],
  N1:[[5,24,90,14,"T5"],[5,39,90,14,"C2"],[5,54,90,14,"S5"]],
  L1:[[4,11,92,5,"L4"],[4,17,92,13,"L2"],[4,34,92,58,"L3"]],
  L2:[[4,30,92,52,"L3"]],
  L3:[[6,86,88,8,"L2"]],
  L4:[[4,25,92,50,"L3"]],
  Y1:[[4,24,92,18,"Y2"],[4,48,92,34,"Y3"]],
  Y2:[],
  Y3:[[6,85,88,8,"Y2"]],
  C1:[[5,26,90,66,"C2"],[56,89,39,4,"C3"]],
  C2:[[5,87,90,8,"C3"]],
  C3:[[76,6,20,5,"C1"],[6,88,88,7,"C1"]],
  S1:[[5,17,90,10,"S4"],[3,27,94,55,"S2"]],
  S2:[[6,78,88,6,"S4"],[6,86,88,8,"S3"]],
  S3:[[5,90,90,7,"S5"]],
  S4:[[6,80,88,7,"S3"]],
  S5:[[6,70,88,10,"T1"]],
  X6:[[15,68,70,8,"S1"]],
  X7:[[15,68,70,8,"S3"]],
  M1:[[79,10,16,5,"M3"],[5,52,90,9,"T5"],[5,61,90,8,"M3"],[5,69,90,9,"M3"],[5,78,90,8,"M3"]],
  M2:[[4,22,92,56,"S3"]],
  M3:[[5,93,90,5,"LO"]],
  LO:[[12,54,76,8,"O1"],[12,65,76,7,"M3"]],
  X8:[[12,60,76,7,"O1"],[12,70,76,7,"M3"]],
  E1:[[15,66,70,8,"T1"]],E2:[[15,66,70,8,"T1"]],E3:[[15,66,70,8,"S1"]],
  X1:[[15,66,70,8,"T1"]],X2:[[0,0,100,100,"T1"]],X3:[[15,66,70,8,"T1"]],X4:[[0,0,100,100,"T1"]]
};

/* geometry (display px, scaled from 390-wide source) */
const PW = 300, SC = PW/390;
function rect(el,o){for(const k in o) el.style[k]=o[k];}
function mkHot(cls, style, target){
  const h=document.createElement("div");
  h.className="hot"+(cls?(" "+cls):"");
  rect(h,style); h.dataset.to=target;
  h.addEventListener("click",()=>{tap();go(target,true);});
  return h;
}

const wrap=document.getElementById("wrap");
const inner=document.getElementById("inner");
const shot=document.getElementById("shot");
const phoneEl=document.querySelector(".phone");
function tap(){phoneEl.classList.remove("tapped");void phoneEl.offsetWidth;phoneEl.classList.add("tapped");}
let cur=null, stack=[];

function buildHots(code){
  [...inner.querySelectorAll(".hot")].forEach(e=>e.remove());
  // back button (top-left)
  if(backed[code]) inner.appendChild(mkHot("", {left:(9*SC)+"px",top:(44*SC)+"px",width:(58*SC)+"px",height:(58*SC)+"px"}, backed[code]));
  // tab bar (bottom, 5 cols)
  if(tabbed.has(code)){
    ["T1","L1","C1","S1","M1"].forEach((t,i)=>{
      inner.appendChild(mkHot("tab",{left:(i*20)+"%",bottom:(18*SC)+"px",width:"20%",height:(76*SC)+"px"},t));
    });
  }
  // precise per-screen button/card hotspots
  (HS[code]||[]).forEach(([x,y,w,h,t])=>{
    inner.appendChild(mkHot("",{left:x+"%",top:y+"%",width:w+"%",height:h+"%"},t));
  });
}

function go(code, push){
  if(!ORDER.includes(code)) return;
  if(push && cur) stack.push(cur);
  cur=code;
  shot.src="screens/"+code+".webp";
  document.getElementById("sname").innerHTML="<b>"+code+"</b> · "+NAME[code];
  const idx=ORDER.indexOf(code);
  document.getElementById("count").textContent=(idx+1)+" / "+ORDER.length;
  // menu highlight
  [...document.querySelectorAll(".item")].forEach(el=>el.classList.toggle("active",el.dataset.code===code));
  shot.onload=()=>buildHots(code);
  if(shot.complete) buildHots(code);
  wrap.scrollTop=0;
  inner.classList.remove("anim");void inner.offsetWidth;inner.classList.add("anim");
  window.scrollTo({top:0,behavior:"smooth"});
}
function back(){ if(stack.length){ cur=null; go(stack.pop(),false);} }

/* build sidebar menu grouped by section */
(function(){
  const menu=document.getElementById("menu"); let lastSec=null;
  SCREENS.forEach(([code,name,sec])=>{
    if(sec!==lastSec){const h=document.createElement("div");h.className="sec";h.textContent=sec;menu.appendChild(h);lastSec=sec;}
    const it=document.createElement("div"); it.className="item"; it.dataset.code=code;
    it.innerHTML='<span class="code">'+code+'</span><span>'+name+'</span>';
    it.addEventListener("click",()=>go(code,true));
    menu.appendChild(it);
  });
})();

/* controls */
document.getElementById("hintsBtn").addEventListener("click",e=>{
  document.body.classList.toggle("hints"); e.currentTarget.classList.toggle("on");
});
document.getElementById("resetBtn").addEventListener("click",()=>{stack=[];go("SP",false);});
document.getElementById("prev").addEventListener("click",()=>{const i=ORDER.indexOf(cur);go(ORDER[(i-1+ORDER.length)%ORDER.length],true);});
document.getElementById("next").addEventListener("click",()=>{const i=ORDER.indexOf(cur);go(ORDER[(i+1)%ORDER.length],true);});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")document.getElementById("next").click();
  if(e.key==="ArrowLeft")document.getElementById("prev").click();
});

go("SP",false);
</script>
</body>
</html>
