name: Deploy staging (single-app stack — superseded)

# ── THIS NO LONGER RUNS ON A PUSH ───────────────────────────────────────────
# It deploys the OLD single-app stack (apps/femi9-web/infra/terraform): Femi9
# alone, its own cluster, its own database. The platform stack now hosts all
# three services — both storefronts and the console — and deploys from the
# `lumi9` branch via deploy-platform.yml.
#
# The push trigger is removed rather than repointed, deliberately. It fired on
# `master`, which is now many commits behind; leaving it armed meant any
# incidental commit to master would redeploy a stale Femi9 over the top of
# whatever the platform stack had just shipped, from a different image, against
# a different database. Nothing warns you when that happens — both deployments
# report success.
#
# It is kept, and kept working, as the rollback path: until the platform stack
# has taken real traffic, being able to put the old one back with one click is
# worth more than the tidiness of deleting the file. Run it from the Actions tab
# and pick the branch you mean.
#
# DELETE THIS FILE once the cutover is done and the single-app stack is
# destroyed. A workflow that can deploy a decommissioned environment is a trap
# for whoever finds it next.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Required to mint the OIDC token that `configure-aws-credentials` exchanges
  # for short-lived AWS credentials. Without it the role assumption fails.
  id-token: write

concurrency:
  group: femi9-staging-deploy
  # Never cancel an image build/deployment that is already in progress. A
  # second push waits in the same group and deploys its own commit afterward.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # OIDC, not stored access keys: GitHub presents a signed token and AWS
          # hands back credentials that expire with the job. Nothing long-lived
          # is kept in this repository. The role's trust policy in
          # .github/iam/github-staging-trust.json decides which branches may
          # assume it.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "851725383246"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push staging image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            --build-arg NEXT_PUBLIC_RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$SENTRY_DSN" \
            -f apps/femi9-web/Dockerfile \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Get current staging task definition
        id: taskdef
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail
          TASK_DEF=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEF" --query taskDefinition > taskdef.json
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' taskdef.json > taskdef-clean.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: taskdef-clean.json
          container-name: app
          image: ${{ steps.image.outputs.uri }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
